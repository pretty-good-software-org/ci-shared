# Base tool versions — shared across all environments
# Domain-specific tools are kept here because ci-shared owns its complete CI toolchain.
[settings]
experimental = true

# Lock entries resolve python-build-standalone artifacts, so every platform
# must select that backend instead of falling back to an unlocked source build.
[settings.python]
compile = false

[tools]
cocogitto = "6.5.0"
# Conftest is the policy engine this repo pins. The policy action's live
# regressions run this exact binary, so a bump must be validated against
# actions/tofu/policy/tests/pinned-policy-isolation.test.ts before it lands.
conftest = "0.68.2"
actionlint = "1.7.11"
yamllint = "1.38.0"
rumdl = "0.2.38"
node = "22.22.1"
"npm:oxfmt" = "0.41.0"
"npm:oxlint" = "1.56.0"
"github:miniscruff/changie" = "1.25.0"
git-cliff = "2.12.0"
python = "3.10.18"
uv = "0.11.26"

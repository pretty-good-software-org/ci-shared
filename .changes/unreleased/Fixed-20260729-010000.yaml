kind: Fixed
body: >-
  Make npm the only manager that may install this repository. A bun or pnpm
  install lays node_modules out differently, which changes the module ids ncc
  emits, so the committed action bundles stopped matching the ones CI rebuilds.
  The build now refuses a tree npm did not install.
